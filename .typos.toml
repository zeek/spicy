[files]
extend-exclude = [
  # This is a file generated from a template not controlled by us.
  "doc/Doxyfile",
]

[type.git-commit]
extend-glob = ["COMMIT_EDITMSG", "MERGE_MSG"]
extend-ignore-re = [
  # Ignore below snip
  '(?ms)^# ------------------------ >8 ------------------------\r?\n.*\z',
  # Ignore comments
  '(?m)^#.*$',
]

[default.extend-words]
inout = "inout"
ocur = "ocur"
bigsur = "Big Sur"
Smoot = "Smoot"
ba = "ba"
Datas = "Datas"
setp = "setp"
Fo = "Fo"
SEH = "SEH"
